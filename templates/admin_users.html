{% extends "layout.html" %}
{% block content %}
  <h2 style="margin:0 0 4px; font-size:20px;">사용자 관리</h2>
  <div class="cap">로그인하면 바로 사용할 수 있습니다(승인 불필요). 아래는 가입한 사용자 목록입니다.</div>

  {% if not users %}
    <div class="callout">아직 가입한 사용자가 없습니다.</div>
  {% else %}
    <table style="margin-top:14px;">
      <thead><tr><th>이름</th><th>가입일시</th><th>삭제</th></tr></thead>
      <tbody>
      {% for u in users %}
        <tr>
          <td><b>{{ u.username }}</b></td>
          <td>{{ (u.createdAt or '')[:16] }}</td>
          <td>
            <form method="post" action="{{ url_for('admin_reject', username=u.username) }}" style="display:inline;"
                  onsubmit="return confirm('{{ u.username }} 계정을 삭제할까요? (검토 기록은 남습니다)');">
              <button class="btn danger" type="submit" style="padding:3px 10px; font-size:12px;">삭제</button>
            </form>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  {% endif %}
{% endblock %}
